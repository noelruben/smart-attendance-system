<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {{ role.title() }} Login
    </title>


    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>


<div class="login-page">


    <div class="login-card login-form-card">


        <a
            href="{{ url_for('home') }}"
            class="back-link"
        >

            ← Back to Portal Selection

        </a>


        <h1>
            {{ role.title() }} Portal
        </h1>


        <p class="subtitle">

            Sign in to continue to your dashboard

        </p>


        {% with messages =
            get_flashed_messages(with_categories=true)
        %}

            {% if messages %}

                {% for category, message in messages %}

                    <div
                        class="flash-message {{ category }}"
                    >

                        {{ message }}

                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <form method="POST">


            <div class="form-group">

                <label>
                    Username
                </label>


                <input
                    type="text"
                    name="username"
                    placeholder="Enter your username"
                    required
                    autofocus
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>


                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-button"
            >

                Sign In

            </button>


        </form>


    </div>


</div>


</body>

</html>
